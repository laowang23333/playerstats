name: PlayerStats
version: 1.0.0
main: com.example.playerstats.PlayerStatsPlugin
api-version: '1.20'
author: OpenAI
description: Read vanilla player statistics on Mohist 1.20.1

commands:
  playerstats:
    description: Query a player's vanilla Minecraft statistics
    usage: /playerstats <player> [mobs|items|blocks|all|stat]
    aliases: [pstats, stats]
    permission: playerstats.use

permissions:
  playerstats.use:
    description: Allows querying player statistics
    default: op
  playerstats.admin:
    description: Allows administrative statistics operations
    default: op
